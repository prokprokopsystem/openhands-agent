# OpenHands Agent — реестр инструментов broker
# Версия: 1.1
#
# Топология:
#   VPS: 95.217.239.148, WG: 10.77.0.1
#   Mini-server: LAN 192.168.100.106, WG: 10.77.0.2
#   Docker bridge openhands-net: 10.89.0.0/28
#     gateway (хост): 10.89.0.1
#     контейнер Canvas: 10.89.0.2
#   Broker: пользователь openhands-broker на mini-server
#     SSH: 10.89.0.1:22 (требует исключения в egress)
#
# Формат: YAML. Секции по серверам.
# Добавление нового инструмента — новая запись без изменения wrapper.

server: mini-server
host: 10.89.0.1
user: openhands-broker
tools:
  - name: ping
    description: Проверка доступности хоста
    risk: A
    params: {}
    execute: "echo pong"
    verify: null
    rollback: null
    secrets: []

  - name: system_status
    description: Статус systemd-службы
    risk: A
    params:
      service:
        type: string
        required: false
        default: "openhands-agent"
        allowed_values: ["openhands-agent", "openhands-agent.service"]
    execute: "systemctl status {{service}} --no-pager -l 2>&1 | head -80"
    verify: null
    rollback: null
    secrets: []

  - name: journal_logs
    description: Журнал systemd-службы
    risk: A
    params:
      service:
        type: string
        required: false
        default: "openhands-agent"
        allowed_values: ["openhands-agent", "openhands-agent.service"]
      lines:
        type: integer
        required: false
        default: 50
        min: 1
        max: 500
    execute: >-
      sudo /usr/local/lib/openhands-broker/journal-logs
      {{service}} {{lines}} 2>&1
    verify: null
    rollback: null
    secrets: []

  - name: docker_ps
    description: Список контейнеров (sudo)
    risk: A
    params: {}
    execute: "sudo docker ps 2>&1"
    verify: null
    rollback: null
    secrets: []

  - name: docker_compose_ps
    description: Статус проекта compose (sudo)
    risk: A
    params: {}
    execute: "sudo docker compose -f /srv/openhands-agent/deployment/compose.yaml ps 2>&1"
    verify: null
    rollback: null
    secrets: []

  - name: docker_compose_logs
    description: Логи compose проекта (sudo)
    risk: A
    params:
      lines:
        type: integer
        required: false
        default: 50
        min: 1
        max: 500
    execute: >-
      sudo docker compose -f /srv/openhands-agent/deployment/compose.yaml
      logs -n {{lines}} --no-color 2>&1 | tail -{{lines}}
    verify: null
    rollback: null
    secrets: []

  - name: disk_usage
    description: Использование диска
    risk: A
    params: {}
    execute: "df -h / /srv 2>&1"
    verify: null
    rollback: null
    secrets: []

  - name: memory_usage
    description: Использование памяти
    risk: A
    params: {}
    execute: "free -h 2>&1"
    verify: null
    rollback: null
    secrets: []

  - name: validate_runtime
    description: Валидация runtime проекта (sudo)
    risk: A
    params: {}
    execute: "sudo /srv/openhands-agent/deployment/scripts/validate-runtime.sh 2>&1"
    verify: null
    rollback: null
    secrets: []

  - name: backup_create
    description: Создать backup проекта (sudo)
    risk: B
    params: {}
    execute: "sudo /usr/local/bin/openhands-backup.sh 2>&1"
    verify: "ls -lt /mnt/amnesia-backup/openhands-agent/daily/ 2>&1 | head -3"
    rollback: null
    secrets: []

  - name: service_restart
    description: Перезапуск службы проекта (sudo)
    risk: B
    params:
      service:
        type: string
        required: true
        allowed_values: ["openhands-agent.service"]
    check: "systemctl is-active --quiet {{service}}"
    execute: "sudo systemctl restart {{service}} 2>&1"
    verify: "systemctl is-active --quiet {{service}}"
    rollback: "sudo systemctl restart {{service}} 2>&1"
    secrets: []

  - name: service_start
    description: Запуск службы проекта (sudo)
    risk: B
    params:
      service:
        type: string
        required: true
        allowed_values: ["openhands-agent.service"]
    execute: "sudo systemctl start {{service}} 2>&1"
    verify: "systemctl is-active --quiet {{service}}"
    rollback: "sudo systemctl stop {{service}} 2>&1"
    secrets: []

  - name: service_stop
    description: Остановка службы проекта (sudo)
    risk: B
    params:
      service:
        type: string
        required: true
        allowed_values: ["openhands-agent.service"]
    execute: "sudo systemctl stop {{service}} 2>&1"
    verify: "test \"$(systemctl is-active {{service}} 2>/dev/null)\" = inactive"
    rollback: "sudo systemctl start {{service}} 2>&1"
    secrets: []
