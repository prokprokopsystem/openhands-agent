# OpenHands Agent Canvas — окончательный Nginx reverse proxy
# canvas.prokop-agent.duckdns.org → HTTPS → WireGuard → Canvas (10.77.0.2:8000)
#
# ПРЕДВАРИТЕЛЬНЫЕ УСЛОВИЯ:
#   1. Сертификат Let's Encrypt уже получен через canvas-bootstrap.conf.
#   2. Файлы сертификата существуют:
#      /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/fullchain.pem
#      /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/privkey.pem
#   3. htpasswd создан: /etc/nginx/.htpasswd-canvas
#
# УСТАНОВКА:
#   sudo cp deployment/nginx/canvas.prokop-agent.duckdns.org.conf \
#           /etc/nginx/sites-available/canvas.prokop-agent.duckdns.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# ОТКАТ:
#   sudo rm /etc/nginx/sites-enabled/canvas.prokop-agent.duckdns.org
#   sudo systemctl reload nginx

# ── HTTP: ACME challenge + редирект на HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name canvas.prokop-agent.duckdns.org;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/canvas-acme;
    }

    # Всё остальное → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Basic Auth → WireGuard → Canvas ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canvas.prokop-agent.duckdns.org;

    # Let's Encrypt сертификат
    ssl_certificate     /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/privkey.pem;

    # Basic Auth — весь сайт
    auth_basic "Canvas Agent Access";
    auth_basic_user_file /etc/nginx/.htpasswd-canvas;

    # Корень: редирект на /canvas
    location = / {
        return 301 /canvas;
    }

    # Основной reverse proxy → Canvas (WireGuard)
    location / {
        proxy_pass http://10.77.0.2:8000;

        proxy_http_version 1.1;

        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket (Canvas использует для streaming-ответов)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для долгих agent-задач
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Отключить буферизацию для streaming
        proxy_buffering off;
        proxy_cache off;
    }
}
