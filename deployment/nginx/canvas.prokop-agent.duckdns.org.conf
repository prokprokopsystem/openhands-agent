# OpenHands Agent Canvas — Nginx reverse proxy
# canvas.prokop-agent.duckdns.org → HTTPS → WireGuard → Canvas (10.77.0.2:8000)
#
# УСТАНОВКА (только ручная):
#   1. Скопировать в /etc/nginx/sites-available/canvas.prokop-agent.duckdns.org
#   2. Создать htpasswd: см. deployment/nginx/README.md
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d canvas.prokop-agent.duckdns.org
#
# ОТКАТ:
#   rm /etc/nginx/sites-enabled/canvas.prokop-agent.duckdns.org
#   systemctl reload nginx
#
# PLACEHOLDER_START — заменить при установке:
#   /etc/nginx/.htpasswd-canvas — путь к файлу паролей Basic Auth
#   canvas.prokop-agent.duckdns.org — домен (должен резолвиться на VPS)
# PLACEHOLDER_END

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name canvas.prokop-agent.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Basic Auth → WireGuard → Canvas ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canvas.prokop-agent.duckdns.org;

    # Basic Auth — весь сайт
    auth_basic "Canvas Agent Access";
    auth_basic_user_file /etc/nginx/.htpasswd-canvas;

    # Корень: редирект на /canvas (удобство — не публиковать внутренние маршруты)
    location = / {
        return 301 /canvas;
    }

    # Основной reverse proxy → Canvas
    location / {
        proxy_pass http://10.77.0.2:8000;

        proxy_http_version 1.1;

        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket (Canvas использует для streaming-ответов)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для долгих agent-задач
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Отключить буферизацию для streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # SSL — управляется Certbot
    # При первой установке (до certbot) раскомментировать self-signed заглушку:
    # ssl_certificate     /etc/nginx/ssl/canvas-selfsigned.crt;
    # ssl_certificate_key /etc/nginx/ssl/canvas-selfsigned.key;

    # После certbot эти строки заменяются автоматически:
    # ssl_certificate /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/canvas.prokop-agent.duckdns.org/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
