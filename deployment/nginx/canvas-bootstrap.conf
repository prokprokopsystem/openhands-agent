# OpenHands Agent Canvas — Bootstrap Nginx (только для получения сертификата)
# canvas.prokop-agent.duckdns.org — HTTP-only, только ACME challenge
#
# НАЗНАЧЕНИЕ:
#   Минимальный конфиг для запуска certbot certonly --webroot.
#   После получения сертификата заменить на окончательный конфиг:
#   canvas.prokop-agent.duckdns.org.conf
#
# НЕ СОДЕРЖИТ: HTTPS, проксирование, Basic Auth, WebSocket.
# ЭТО ВРЕМЕННЫЙ ФАЙЛ — удалить после замены на основной конфиг.

server {
    listen 80;
    listen [::]:80;
    server_name canvas.prokop-agent.duckdns.org;

    # ACME webroot для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/canvas-acme;
    }

    # Всё остальное — временный 503 (сертификата ещё нет)
    location / {
        return 503;
    }
}
