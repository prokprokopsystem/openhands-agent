# OpenHands Agent Canvas — Compose
# Версия: 1.6.1
# Digest linux/amd64: sha256:fc24163754bee2ab0115b117d57512cc01b4d99770e7ac17c3607e76290deeb6
#
# Управление lifecycle: systemd (deployment/systemd/openhands-agent.service)
# Docker restart policy: "no" — перезапуск через systemd Restart=on-failure

services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.6.1@sha256:fc24163754bee2ab0115b117d57512cc01b4d99770e7ac17c3607e76290deeb6
    container_name: openhands-agent
    restart: "no"

    ports:
      - "10.77.0.2:8000:8000"

    volumes:
      - /srv/openhands-agent/config:/home/openhands/.openhands:rw
      - /srv/openhands-agent/test-workspace:/projects:rw

    env_file:
      - /srv/openhands-agent/secrets/.env

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "1G"

    security_opt:
      - no-new-privileges:true

    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    networks:
      openhands-net:
        ipv4_address: 10.89.0.2

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:8000/canvas && python3 -c "import socket; socket.create_connection(('127.0.0.1',18000),3).close(); socket.create_connection(('127.0.0.1',18001),3).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openhands-net:
    driver: bridge
    name: openhands-net
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.89.0.0/28
          gateway: 10.89.0.1
