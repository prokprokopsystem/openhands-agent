# OpenHands Agent Canvas — Compose
# Версия: 1.6.1
# Digest: sha256:fc24163754bee2ab0115b117d57512cc01b4d99770e7ac17c3607e76290deeb6
# Образ: ghcr.io/openhands/agent-canvas:1.6.1@sha256:fc24163754bee2ab0115b117d57512cc01b4d99770e7ac17c3607e76290deeb6

services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.6.1@sha256:fc24163754bee2ab0115b117d57512cc01b4d99770e7ac17c3607e76290deeb6
    container_name: openhands-agent
    restart: unless-stopped

    ports:
      - "10.77.0.2:8000:8000"

    volumes:
      - /srv/openhands-agent/config:/home/openhands/.openhands:rw
      - /srv/openhands-agent/test-workspace:/projects:rw

    env_file:
      - /srv/openhands-agent/secrets/.env

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "1G"

    security_opt:
      - no-new-privileges:true

    read_only: false

    networks:
      openhands-net:
        ipv4_address: 10.89.0.2

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/canvas | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  openhands-net:
    driver: bridge
    name: openhands-net
    ipam:
      config:
        - subnet: 10.89.0.0/28
