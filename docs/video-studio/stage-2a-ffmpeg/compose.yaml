name: video-studio

# Схема защиты диска:
#   • ffmpeg может писать только в tmpfs /out — предел объёма задаёт ядро;
#   • каталог хоста НЕ монтируется в контейнер вообще, поэтому процесс
#     монтажа физически не имеет цели для записи на диск;
#   • результат забирается наружу одним шагом docker cp (scripts/run-render.sh),
#     объём копии заведомо не больше размера tmpfs.
#
# Контейнер работает постоянно (sleep infinity), потому что tmpfs живёт только
# пока контейнер запущен. Рендеры выполняются внутри него через docker exec.
services:
  studio:
    image: video-studio/ffmpeg:8.0.1
    build:
      context: ./image/ffmpeg
    # Без аргументов контейнер просто живёт и держит tmpfs /out.
    # С аргументами entrypoint сам передаёт их ограде и ffmpeg, поэтому
    # `docker compose run --rm studio -version` работает как ожидается.
    user: "10001:10001"
    read_only: true
    init: true
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: "none"
    restart: "no"
    # Второй независимый предел: размер одного файла (ядро).
    ulimits:
      fsize: 1073741824
    tmpfs:
      # 1777, потому что uid/gid в опциях tmpfs этот runtime не принимает:
      # смонтированный tmpfs принадлежит root, а процесс работает от 10001.
      # В контейнере существует единственный пользователь, поэтому риск нулевой.
      - /out:size=1g,mode=1777
      - /tmp:size=256m,mode=1777
      - /run:size=16m,mode=0755
    volumes:
      - type: bind
        source: ./work
        target: /work
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
